name: tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "16.0*"
  push:
    branches:
      - "16.0"
      - "16.0-ocabot-*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unreleased-deps:
    runs-on: ubuntu-latest
    name: Detect unreleased dependencies
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          for reqfile in requirements.txt test-requirements.txt ; do
              if [ -f ${reqfile} ] ; then
                  result=0
                  # reject non-comment lines that contain a / (i.e. URLs, relative paths)
                  grep "^[^#].*/" ${reqfile} || result=$?
                  if [ $result -eq 0 ] ; then
                      echo "Unreleased dependencies found in ${reqfile}."
                      exit 1
                  fi
              fi
          done
  test:
    runs-on: ubuntu-22.04
    container: ${{ matrix.container }}
    name: ${{ matrix.name }}
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: ghcr.io/oca/oca-ci/py3.10-ocb16.0:latest
            name: test with OCB
            makepot: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install addons and dependencies
        run: oca_install_addons
      - name: Check licenses
        run: manifestoo -d . check-licenses
      - name: Check development status
        run: manifestoo -d . check-dev-status --default-dev-status=Beta
      - name: Install base alone without CRM or Marketing
        run: |
          odoo --database=content_base_only --init=content_center_base --stop-after-init --no-http --workers=0 --max-cron-threads=0 --without-demo=all
          python - <<'PYTHON'
          import psycopg2
          with psycopg2.connect(dbname="content_base_only") as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT name FROM ir_module_module WHERE state='installed' AND (name='crm' OR name LIKE 'marketing_center_%' OR (name='content_center_sale' OR name LIKE 'contact_center%'))")
                  assert not cursor.fetchall(), "Base must install independently"
          PYTHON
      - name: Initialize test db
        run: oca_init_test_database
      - name: Run tests including post-install QUnit suites
        shell: bash
        run: |
          set -euo pipefail
          oca_run_tests 2>&1 | tee "${RUNNER_TEMP}/content-center-tests.log"
          python - <<'PYTHON'
          import os
          from pathlib import Path

          log = (Path(os.environ["RUNNER_TEMP"]) / "content-center-tests.log").read_text()
          for addon in (
              "content_center_base",
          ):
              for mode in ("minified", "assets"):
                  marker = f"Content QUnit verified: {addon} {mode}"
                  assert marker in log, f"Missing successful browser suite: {marker}"
          PYTHON
      - name: Upload test log and QUnit counts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: Test log - ${{ matrix.name }}
          path: ${{ runner.temp }}/content-center-tests.log
          if-no-files-found: ignore
      - name: Verify optional composition and nonzero tests
        run: |
          python - <<'PYTHON'
          import os
          import re
          import psycopg2
          from pathlib import Path
          log = (Path(os.environ["RUNNER_TEMP"]) / "content-center-tests.log").read_text()
          for name in ("content_center_base", "content_center_sale", "content_center_contact_center"):
              assert re.search(rf"{name}: [1-9][0-9]* tests", log), f"Missing nonzero tests for {name}"
          with psycopg2.connect(dbname=os.environ["PGDATABASE"]) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT name FROM ir_module_module WHERE state = 'installed' AND (name = 'crm' OR name LIKE 'marketing_center_%')")
                  assert not cursor.fetchall(), "Content must not install CRM/Marketing"
          PYTHON
      - name: Upload screenshots from JS tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ failure() }}
        with:
          name: Screenshots of failed JS tests - ${{ matrix.name }}
          path: /tmp/odoo_tests/${{ env.PGDATABASE }}
          if-no-files-found: ignore
      - name: Update .pot files
        run:
          oca_export_and_push_pot https://x-access-token:${{ secrets.GIT_PUSH_TOKEN
          }}@github.com/${{ github.repository }}
        if:
          ${{ matrix.makepot == 'true' && github.event_name == 'push' &&
          github.repository_owner == 'soloztech' }}
